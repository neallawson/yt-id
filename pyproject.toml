[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytid"
version = "0.1.0"
description = "Identify artist/genre for a folder of YouTube-sourced music videos and organize them into /genre/Artist folders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ytid = "ytid.cli:main"

[tool.setuptools]
packages = ["ytid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
